<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Carpe Noctem Mond-Logo">
  <defs>
    <linearGradient id="cnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3da8f"/>
      <stop offset="0.45" stop-color="#e6c068"/>
      <stop offset="1" stop-color="#c39d45"/>
    </linearGradient>
    <mask id="cnCrescent">
      <rect width="200" height="200" fill="#000"/>
      <circle cx="98" cy="102" r="82" fill="#fff"/>
      <circle cx="128" cy="84" r="70" fill="#000"/>
    </mask>
  </defs>

  <!-- Gold crescent with engraved texture -->
  <g mask="url(#cnCrescent)">
    <circle cx="98" cy="102" r="82" fill="url(#cnGold)"/>
    <g fill="none" stroke="#080827" stroke-linecap="round">
      <circle cx="98" cy="102" r="78" stroke-opacity="0.10" stroke-width="1.1"/>
      <circle cx="98" cy="102" r="72" stroke-opacity="0.16" stroke-width="0.9"/>
      <circle cx="98" cy="102" r="66" stroke-opacity="0.12" stroke-width="1.2"/>
      <circle cx="98" cy="102" r="60" stroke-opacity="0.18" stroke-width="0.8"/>
      <circle cx="98" cy="102" r="54" stroke-opacity="0.14" stroke-width="1.0"/>
      <circle cx="98" cy="102" r="48" stroke-opacity="0.20" stroke-width="0.8"/>
      <circle cx="98" cy="102" r="42" stroke-opacity="0.13" stroke-width="1.1"/>
      <circle cx="98" cy="102" r="36" stroke-opacity="0.18" stroke-width="0.8"/>
      <circle cx="98" cy="102" r="30" stroke-opacity="0.12" stroke-width="0.9"/>
      <circle cx="98" cy="102" r="24" stroke-opacity="0.16" stroke-width="0.7"/>
    </g>
  </g>

  <!-- Night sky sparkles inside the crescent -->
  <g fill="#e6c068">
    <!-- prominent 4-point star -->
    <path d="M132 66 C132 78 138 84 150 84 C138 84 132 90 132 102 C132 90 126 84 114 84 C126 84 132 78 132 66 Z"/>
    <!-- smaller sparkles -->
    <path d="M112 60 C112 65 114.5 67.5 119 67.5 C114.5 67.5 112 70 112 74.5 C112 70 109.5 67.5 105 67.5 C109.5 67.5 112 65 112 60 Z" opacity="0.95"/>
    <path d="M150 104 C150 108 152 110 156 110 C152 110 150 112 150 116 C150 112 148 110 144 110 C148 110 150 108 150 104 Z" opacity="0.9"/>
    <circle cx="120" cy="96" r="1.5"/>
    <circle cx="140" cy="72" r="1.2"/>
    <circle cx="108" cy="86" r="1.1"/>
    <circle cx="146" cy="94" r="1.3"/>
    <circle cx="128" cy="110" r="1.1"/>
    <circle cx="134" cy="98" r="0.9"/>
    <circle cx="118" cy="108" r="0.9"/>
    <circle cx="152" cy="80" r="0.9"/>
  </g>
</svg>
